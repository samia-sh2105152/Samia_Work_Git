name: basair_real_app
description: "A new Flutter project."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.6.2 <4.0.0"
  flutter: ">=3.16.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  go_router: ^16.3.0
  quran: ^1.3.3
  audioplayers: ^6.4.0
  to_arabic_number: ^1.0.1
  flutter_riverpod: ^2.0.0
  supabase_flutter: ^2.8.1
  dio: ^5.9.0
  path: ^1.9.0
  path_provider: ^2.1.5
  json_annotation: ^4.8.1
  cached_network_image: ^3.3.0
  shared_preferences: ^2.2.2
  flutter_dotenv: ^5.1.0
  freezed_annotation: ^2.2.0
  uuid: ^4.4.0
  app_links: ^5.0.0
  connectivity_plus: ^7.0.0
  provider: ^6.1.5+1
  intl: ^0.20.2
  floor: ^1.5.0
  sqflite: ^2.4.1
  riverpod: ^2.6.1
  http: ^1.6.0
  flutter_pdfview: ^1.4.3
  mockito: ^5.4.4
  mocktail: ^1.0.4
  integration_test:
    sdk: flutter


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.6
  json_serializable: ^6.7.1
  freezed: ^2.2.0
  floor_generator: ^1.5.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/data/
    - assets/fonts/
    - assets/data/resources/youtubelinks/

    - .env
    - assets/data/mahawer.json
    - assets/data/resources/pdfs/
    - assets/data/resources/images/
    - assets/data/resources/websites/
    - assets/data/mahawer04.json

  fonts:
    - family: CrimsonText
      fonts:
        - asset: assets/fonts/CrimsonText-Regular.ttf
    - family: Hafs
      fonts:
        - asset: assets/fonts/Hafs.ttf
